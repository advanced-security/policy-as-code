name: Main

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

  workflow_dispatch:

permissions:
  contents: read
  security-events: read

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '${{ matrix.python-version }}'

      - name: Install dependencies
        run: |
          python -m pip install 'pip==26.0.1' 'pipenv==2025.0.4'
          pipenv sync --dev

      # Unit tests
      - name: Run Unit tests
        run: |
          pipenv run test

      - name: Run Formatter
        run: |
          pipenv run lint

  e2e-tests:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    needs: run 
    env:
      POLICY_AS_CODE_TESTING_TOKEN: ${{ secrets.POLICY_AS_CODE_TESTING_TOKEN }}

    steps:
    - uses: actions/checkout@v7
    - name: Skip e2e when token is unavailable
      if: ${{ env.POLICY_AS_CODE_TESTING_TOKEN == '' }}
      run: echo "Skipping e2e-tests because POLICY_AS_CODE_TESTING_TOKEN is not configured for this event."
    - name: Run action
      if: ${{ env.POLICY_AS_CODE_TESTING_TOKEN != '' }}
      uses: ./
      with:
        action: continue
        token: "${{ env.POLICY_AS_CODE_TESTING_TOKEN }}"

  action-test:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    needs: run 
    env:
      POLICY_AS_CODE_TESTING_TOKEN: ${{ secrets.POLICY_AS_CODE_TESTING_TOKEN }}

    steps:
    - uses: actions/checkout@v7
    - name: Run action
      if: ${{ env.POLICY_AS_CODE_TESTING_TOKEN != '' }}
      uses: ./
      with:
        token: "${{ env.POLICY_AS_CODE_TESTING_TOKEN }}"
