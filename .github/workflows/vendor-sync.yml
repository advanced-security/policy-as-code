name: Vendor Sync

# Keeps vendor/ (see vendor/README.md) in sync with Pipfile.lock. Dependabot
# only updates Pipfile/Pipfile.lock (advanced-security/policy-as-code#94) -
# nothing regenerates the vendored copies. This workflow runs `pipenv run
# vendor` after Pipfile.lock changes on main and opens a PR with the diff.
on:
  push:
    branches: [ main ]
    paths:
      - 'Pipfile.lock'
  workflow_dispatch:

concurrency:
  group: vendor-sync
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-vendor:
    if: github.repository == 'advanced-security/policy-as-code'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pipenv
        run: python -m pip install 'pip==26.0.1' 'pipenv==2025.0.4'

      - name: Sync environment
        run: pipenv sync --dev

      # `pipenv run vendor` is a Pipfile script alias - see the [scripts]
      # section in Pipfile: `vendor = "./vendor/update.sh"`. So this step
      # runs vendor/update.sh, just indirectly through pipenv/Pipfile
      # instead of calling the .sh file directly.
      - name: Regenerate vendor/ from Pipfile.lock (runs vendor/update.sh)
        run: pipenv run vendor

      - name: Check for vendor changes
        id: diff
        run: |
          if git status --porcelain -- vendor | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests against the regenerated vendor/ tree
        if: steps.diff.outputs.changed == 'true'
        env:
          # pipenv run test alone exercises the pipenv virtualenv install,
          # NOT the vendor/ tree we just regenerated - those are two
          # separate installs of the same Pipfile.lock versions, so a
          # broken vendor/ (bad --target install, missing files, etc.)
          # could pass silently. Mirror action.yml's runtime PYTHONPATH
          # (repo root, then vendor/) so imports resolve the same way
          # production does, and this actually validates vendor/.
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/vendor
        run: pipenv run test

      # TODO(#94): This step opens the PR using the default GITHUB_TOKEN.
      # GitHub deliberately blocks workflow runs authenticated with the
      # default GITHUB_TOKEN from triggering other `push`/`pull_request`
      # workflows:
      # https://docs.github.com/actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow
      # That means the branch-protection-required checks on main
      # ("run (3.10)", "run (3.11)", "run (3.12)", "run (3.13)", "e2e-tests") will NOT start
      # automatically on the PR created below, so it will sit blocked/pending
      # until a maintainer manually re-runs them (e.g. via "Re-run jobs" in
      # the Actions tab, or by pushing an empty commit to the PR branch).
      # To close the loop, provision a PAT or GitHub App installation token
      # scoped to contents+pull-requests, store it as a repo secret (e.g.
      # VENDOR_SYNC_TOKEN), and use it for both actions/checkout (persist-
      # credentials) and the `gh` calls below so PR-triggered CI fires the
      # same way it would for a human-authored PR.
      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          BRANCH="chore/vendor-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add vendor
          git commit -m "chore(vendor): sync vendored dependencies with Pipfile.lock"
          git push --force origin "$BRANCH"

          cat <<'EOF' > /tmp/vendor-sync-pr-body.md
          Auto-generated by the **Vendor Sync** workflow after `Pipfile.lock` changed on `main` (e.g. a merged Dependabot PR). Regenerates `vendor/` via `pipenv run vendor` per [vendor/README.md](https://github.com/advanced-security/policy-as-code/blob/main/vendor/README.md).

          > [!WARNING]
          > This PR was opened with the default `GITHUB_TOKEN`, so GitHub will **not** auto-trigger the required status checks (`run (3.10)`, `run (3.11)`, `run (3.12)`, `run (3.13)`, `e2e-tests`). A maintainer needs to manually re-run them (or push an empty commit) before merging. See the `TODO(#94)` note in `.github/workflows/vendor-sync.yml` for the long-term fix.
          EOF

          if [ -n "$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')" ]; then
            echo "Existing vendor-sync PR updated via force-push."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(vendor): sync vendored dependencies" \
              --body-file /tmp/vendor-sync-pr-body.md
          fi
